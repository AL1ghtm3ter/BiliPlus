name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-source:
    name: Node 24 simulated integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked development dependencies
        run: npm ci
      - name: Check syntax and manifest resources
        run: npm run check
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and simulated integration tests
        run: npm test
      - name: Build readable unpacked extension
        run: npm run build
      # Synthetic DOM checks do not replace real Bilibili page acceptance.
