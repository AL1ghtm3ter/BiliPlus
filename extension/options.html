<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>小电视助手 · BiliPlus · 设置</title>
    <link rel="stylesheet" href="options.css" />
    <script defer src="common/config.js"></script>
    <script defer src="common/ui.js"></script>
    <script defer src="common/settings-fields.js"></script>
    <script defer src="options.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="common/brand.svg" width="28" height="28" alt="" />
          <div>
            <p class="brand-line">
              BiliPlus
              <span class="version-prefix">v<span id="version"></span></span>
            </p>
            <h1>小电视助手 · BiliPlus</h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="appearance" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M8 21h8m-4-4v4" /></svg
            >外观
          </button>
          <a href="https://www.bilibili.com/" target="_blank" rel="noreferrer"
            >打开 B站</a
          >
          <span class="source-badge">独立源码版</span>
        </div>
      </div>
    </header>
    <div class="layout">
      <nav aria-label="设置分类" id="nav"></nav>
      <main>
        <div id="pages"></div>
        <section id="page-backup" class="page" hidden>
          <h2>备份与维护</h2>
          <p>
            配置备份只包含本插件开关和规则，不含 Codex
            登录、视频字幕或浏览器账号。
          </p>
          <div class="button-row">
            <button id="export" type="button">导出配置</button
            ><label class="file-button"
              >导入配置<input
                id="import"
                type="file"
                accept="application/json,.json" /></label
            ><button id="clear-cache" type="button">清除 AI 与字幕缓存</button
            ><button id="reset" type="button">恢复默认设置</button>
          </div>
          <h3>本机连接</h3>
          <button id="check" type="button">检查模型与本机转写</button>
          <p id="connection" role="status"></p>
          <h3>最近诊断</h3>
          <p>仅记录功能、错误、耗时与字幕条数，不记录密钥或完整字幕。</p>
          <div id="diagnostics"></div>
        </section>
        <div class="savebar">
          <p id="status" role="status" aria-live="polite">
            修改后点击保存，已打开的 B站页面会自动应用。
          </p>
          <button id="save" type="button" class="primary">保存设置</button>
        </div>
      </main>
    </div>
  </body>
</html>
