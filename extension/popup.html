<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>小电视助手 · BiliPlus</title>
    <link rel="stylesheet" href="popup.css" />
    <script defer src="common/config.js"></script>
    <script defer src="common/ui.js"></script>
    <script defer src="popup.js"></script>
  </head>
  <body>
    <div class="popup-shell">
      <main class="popup-panel">
        <header class="popup-header">
          <div class="brand">
            <img src="common/brand.svg" width="28" height="28" alt="" />
            <div>
              <p class="brand-line">BiliPlus <span id="version"></span></p>
              <h1>小电视助手 · BiliPlus</h1>
            </div>
          </div>
          <div class="header-actions">
            <button
              id="theme"
              type="button"
              title="界面外观"
              aria-label="打开外观设置"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="13" rx="2" />
                <path d="M8 21h8m-4-4v4" />
              </svg>
            </button>
            <button id="settings" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>设置</span>
            </button>
          </div>
        </header>
        <div id="ai-toggle"></div>
        <div id="favorites"></div>
        <div id="groups"></div>
        <footer>
          <div class="footer-actions">
            <button id="show" type="button">定位 AI 助手</button>
            <button id="check" type="button">检查本机连接</button>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
          <p id="stats"></p>
          <details class="quote-details">
            <summary>每日一句</summary>
            <p id="quote"></p>
          </details>
        </footer>
      </main>
    </div>
  </body>
</html>
